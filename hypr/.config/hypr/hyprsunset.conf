# Makes hyprsunset do nothing to the screen by default
# Without this, the default applies some tint to the monitor
profile {
    time = 07:00
    identity = true
}

# hyprsunset runs via its packaged systemd user unit (not autostart.lua):
#   systemctl --user enable --now hyprsunset.service
# To enable auto switch to nightlight, add a profile like the following
# (then `systemctl --user restart hyprsunset.service`):
# profile {
#     time = 20:00
#     temperature = 4000
# }
