// Prints the compile classpath of every Java/Groovy module as `NVIM_CP:<path>` lines,
// read by lua/gradle-classpath.lua for groovy-language-server.
// Jars only: groovyls expands a directory entry to the jars inside it, so class directories do nothing.
// Jars under the project are skipped: they are stale copies of sources the server compiles itself.
allprojects {
  plugins.withId('java') {
    tasks.register('nvimClasspath') {
      doLast {
        def root = rootProject.projectDir.toPath()
        def files = [] as LinkedHashSet
        // every source set: groovyls compiles all .groovy files under the root, integration tests included
        sourceSets.each { files.addAll(it.compileClasspath.files) }
        files.findAll { it.isFile() && it.name.endsWith('.jar') && !it.toPath().startsWith(root) }
          .each { println "NVIM_CP:${it.absolutePath}" }
      }
    }
  }
}
